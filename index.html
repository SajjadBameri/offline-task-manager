<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>مدیریت کارها</title>

    <!-- فونت وزیرمتن -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">

    <!-- Bootstrap + Icons -->
    <link rel="stylesheet" href="assets/bostrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- تقویم شمسی -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css">

    <!-- استایل‌های خودتان -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/util.css">
    <link rel="stylesheet" href="assets/css/btn.css">
    <!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6366f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="مدیریت کارها">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">

    <style>
      /* ⚠️ مهم: تعریف dis-hide برای همه چیز */
      .dis-hide { display: none !important; }

      :root {
        --primary: #6366f1;
        --primary-dark: #4f46e5;
        --success: #10b981;
        --danger: #ef4444;
        --warning: #f59e0b;
        --info: #06b6d4;
        --border-light: rgba(0,0,0,0.08);
        --border-dark: rgba(255,255,255,0.1);
        --card-light: rgba(255,255,255,0.75);
        --card-dark: rgba(30,41,59,0.75);
      }

      * { font-family: 'Vazirmatn', sans-serif !important; box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
      }

      body {
        background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%);
        min-height: 100vh;
        transition: background 0.4s ease;
        padding-bottom: 100px;
      }

      body.dark-background {
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        color: #e2e8f0;
      }

      /* ============ Loader ============ */
      #lode {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%);
        z-index: 99999;
        transition: opacity 0.4s ease;
      }

      body.dark-background #lode {
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      }

      #lode.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      #lode .spinner {
        width: 56px;
        height: 56px;
        border: 4px solid rgba(99,102,241,0.2);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }

      @keyframes spin { to { transform: rotate(360deg); } }

      #lode p {
        margin-top: 20px;
        color: #64748b;
        font-weight: 500;
        font-size: 15px;
      }

      /* ============ Header ============ */
      .app-header {
        background: var(--card-light);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--border-light);
        border-radius: 20px;
        padding: 12px 16px;
        margin-bottom: 16px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.04);
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      body.dark-background .app-header {
        background: var(--card-dark);
        border-color: var(--border-dark);
        box-shadow: 0 4px 24px rgba(0,0,0,0.3);
      }

      .brand-logo {
        width: 42px;
        height: 42px;
        min-width: 42px;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 20px;
        box-shadow: 0 8px 20px rgba(99,102,241,0.35);
        transition: transform 0.3s ease;
      }

      .brand-logo:hover { transform: rotate(-10deg) scale(1.05); }

      .add-btn {
        width: 42px;
        height: 42px;
        min-width: 42px;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        border: none;
        box-shadow: 0 8px 20px rgba(99,102,241,0.35);
        transition: all 0.3s ease;
        cursor: pointer;
      }

      .add-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 28px rgba(99,102,241,0.5);
      }

      /* ============ Search ============ */
      .search-wrap {
        position: relative;
        flex: 1;
        min-width: 150px;
      }

      .search-wrap > i {
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: #94a3b8;
        pointer-events: none;
        font-size: 15px;
        z-index: 2;
      }

      .search-input {
        width: 100%;
        padding: 10px 40px 10px 14px;
        border-radius: 14px;
        border: 1px solid var(--border-light);
        background: rgba(255,255,255,0.8);
        font-size: 14px;
        transition: all 0.25s ease;
        outline: none;
        color: inherit;
      }

      body.dark-background .search-input {
        background: rgba(15,23,42,0.6);
        border-color: var(--border-dark);
      }

      .search-input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(99,102,241,0.12);
        background: #fff;
      }

      body.dark-background .search-input:focus {
        background: rgba(15,23,42,0.9);
      }

      /* ============ Icon buttons ============ */
      .icon-btn {
        width: 42px;
        height: 42px;
        min-width: 42px;
        border-radius: 14px;
        border: 1px solid var(--border-light);
        background: rgba(255,255,255,0.8);
        color: #64748b;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 17px;
        cursor: pointer;
        transition: all 0.25s ease;
      }

      body.dark-background .icon-btn {
        background: rgba(15,23,42,0.6);
        border-color: var(--border-dark);
        color: #cbd5e1;
      }

      .icon-btn:hover {
        border-color: var(--primary);
        color: var(--primary);
        transform: translateY(-2px);
      }

      .icon-btn.active {
        background: linear-gradient(135deg, var(--info), #0891b2);
        color: #fff;
        border-color: transparent;
      }

      /* ============ Stats ============ */
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 16px;
      }

      .stat-card {
        background: var(--card-light);
        backdrop-filter: blur(20px);
        border: 1px solid var(--border-light);
        border-radius: 18px;
        padding: 14px 10px;
        text-align: center;
        position: relative;
        overflow: hidden;
        transition: all 0.3s ease;
        box-shadow: 0 4px 16px rgba(0,0,0,0.04);
      }

      body.dark-background .stat-card {
        background: var(--card-dark);
        border-color: var(--border-dark);
        box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      }

      .stat-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      }

      .stat-icon {
        width: 34px;
        height: 34px;
        border-radius: 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        margin-bottom: 6px;
      }

      .stat-total .stat-icon { background: rgba(99,102,241,0.15); color: var(--primary); }
      .stat-done .stat-icon { background: rgba(16,185,129,0.15); color: var(--success); }
      .stat-urgent .stat-icon { background: rgba(239,68,68,0.15); color: var(--danger); }

      .stat-value {
        font-size: 20px;
        font-weight: 700;
        line-height: 1.2;
        color: inherit;
      }

      .stat-label {
        font-size: 11px;
        color: #94a3b8;
        margin-top: 2px;
      }

      /* ============ Task card ============ */
      .task {
        background: var(--card-light);
        backdrop-filter: blur(20px);
        border: 1px solid var(--border-light);
        border-radius: 18px;
        padding: 16px;
        margin-bottom: 12px;
        transition: all 0.3s ease;
        box-shadow: 0 2px 12px rgba(0,0,0,0.04);
        position: relative;
        overflow: hidden;
      }

      body.dark-background .task {
        background: var(--card-dark);
        border-color: var(--border-dark);
        box-shadow: 0 2px 12px rgba(0,0,0,0.25);
      }

      .task:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      }

      .task::before {
        content: '';
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 4px;
        background: var(--primary);
        border-radius: 0 18px 18px 0;
      }

      .task.priority-urgent::before { background: var(--warning); }
      .task.priority-overdue::before { background: var(--danger); }
      .task.task-completed::before { background: var(--success); }
      .task.task-completed { opacity: 0.7; }

      .task-title {
        font-size: 16px;
        font-weight: 700;
        margin-bottom: 6px;
        word-break: break-word;
      }

      .task-desc {
        font-size: 13px;
        color: #64748b;
        margin-bottom: 12px;
        line-height: 1.6;
        word-break: break-word;
      }

      body.dark-background .task-desc { color: #94a3b8; }

      .task-meta {
        font-size: 12px;
        color: #94a3b8;
        padding-top: 10px;
        border-top: 1px solid var(--border-light);
        margin-bottom: 12px;
      }

      body.dark-background .task-meta { border-color: var(--border-dark); }

      .task-meta .meta-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
      }

      /* ============ Badges ============ */
      .task-badge {
        font-size: 11px;
        font-weight: 600;
        padding: 5px 10px;
        border-radius: 10px;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .badge-normal { background: rgba(148,163,184,0.15); color: #64748b; }
      .badge-soon { background: rgba(6,182,212,0.15); color: #0891b2; }
      .badge-urgent { background: rgba(245,158,11,0.15); color: #d97706; }
      .badge-overdue { background: rgba(239,68,68,0.15); color: #dc2626; }
      .badge-done { background: rgba(16,185,129,0.15); color: #059669; }

      /* ============ Task actions ============ */
      .task-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 10px;
        border-top: 1px solid var(--border-light);
        gap: 8px;
        flex-wrap: wrap;
      }

      body.dark-background .task-actions { border-color: var(--border-dark); }

      .done-toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        user-select: none;
        padding: 6px 10px;
        border-radius: 10px;
        transition: background 0.2s ease;
        font-size: 13px;
      }

      .done-toggle:hover { background: rgba(99,102,241,0.08); }

      .done-toggle input { display: none; }

      .done-toggle .check-icon {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid #cbd5e1;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.25s ease;
        font-size: 12px;
        color: transparent;
      }

      .done-toggle input:checked + .check-icon {
        background: var(--success);
        border-color: var(--success);
        color: #fff;
      }

      .action-btn {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        border: 1px solid var(--border-light);
        background: transparent;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.25s ease;
        color: inherit;
      }

      body.dark-background .action-btn { border-color: var(--border-dark); }

      .action-btn.edit { color: var(--primary); }
      .action-btn.edit:hover {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
        transform: translateY(-2px);
      }

      .action-btn.delete { color: var(--danger); }
      .action-btn.delete:hover {
        background: var(--danger);
        color: #fff;
        border-color: var(--danger);
        transform: translateY(-2px);
      }

      /* ============ Blur layer ============ */
      .blur-layer {
        position: fixed;
        inset: 0;
        background: rgba(15,23,42,0.5);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        z-index: 1000;
      }

      /* ============ Modal / Form ============ */
      .form-modal {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 92%;
        max-width: 500px;
        max-height: 90vh;
        overflow-y: auto;
        background: #fff;
        border-radius: 24px;
        padding: 26px;
        z-index: 1001;
        box-shadow: 0 20px 60px rgba(0,0,0,0.25);
        animation: modalIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      body.dark-background .form-modal {
        background: #1e293b;
        color: #e2e8f0;
      }

      @keyframes modalIn {
        from { opacity: 0; transform: translate(-50%, -46%) scale(0.96); }
        to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      }

      .form-modal h5 {
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .form-modal h5 i {
        width: 36px;
        height: 36px;
        min-width: 36px;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: #fff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
      }

      .form-modal .form-label {
        font-size: 13px;
        font-weight: 600;
        color: #475569;
        margin-bottom: 6px;
        display: block;
      }

      body.dark-background .form-modal .form-label { color: #cbd5e1; }

      .form-modal .form-control {
        width: 100%;
        border-radius: 12px;
        border: 1px solid var(--border-light);
        padding: 10px 14px;
        font-size: 14px;
        background: rgba(248,250,252,0.6);
        transition: all 0.25s ease;
        outline: none;
        color: inherit;
      }

      body.dark-background .form-modal .form-control {
        background: rgba(15,23,42,0.6);
        border-color: var(--border-dark);
      }

      .form-modal .form-control:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(99,102,241,0.12);
        background: #fff;
      }

      body.dark-background .form-modal .form-control:focus {
        background: rgba(15,23,42,0.9);
      }

      /* ============ Buttons ============ */
      .btn-primary-gradient {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        border: none;
        color: #fff;
        border-radius: 12px;
        padding: 12px 20px;
        font-weight: 600;
        transition: all 0.25s ease;
        box-shadow: 0 6px 16px rgba(99,102,241,0.3);
        cursor: pointer;
        font-size: 14px;
      }

      .btn-primary-gradient:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 24px rgba(99,102,241,0.4);
      }

      .btn-ghost {
        background: transparent;
        border: 1px solid var(--border-light);
        color: #64748b;
        border-radius: 12px;
        padding: 12px 20px;
        font-weight: 600;
        transition: all 0.25s ease;
        cursor: pointer;
        font-size: 14px;
      }

      body.dark-background .btn-ghost { border-color: var(--border-dark); color: #cbd5e1; }

      .btn-ghost:hover { background: rgba(239,68,68,0.08); color: var(--danger); border-color: var(--danger); }

      .btn-danger {
        background: var(--danger);
        border: none;
        color: #fff;
        border-radius: 12px;
        padding: 12px 20px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.25s ease;
        font-size: 14px;
      }

      .btn-danger:hover { background: #dc2626; transform: translateY(-2px); }

      /* ============ Confirm delete ============ */
      .confirm-modal {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 90%;
        max-width: 380px;
        background: #fff;
        border-radius: 20px;
        padding: 24px;
        z-index: 1001;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0,0,0,0.25);
        animation: modalIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      body.dark-background .confirm-modal { background: #1e293b; color: #e2e8f0; }

      .confirm-modal .icon-warn {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: rgba(239,68,68,0.12);
        color: var(--danger);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        margin-bottom: 14px;
      }

      /* ============ Bottom bar ============ */
      .bottom-bar {
        position: fixed;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        width: calc(100% - 24px);
        max-width: 720px;
        background: var(--card-light);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--border-light);
        border-radius: 18px;
        padding: 10px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        z-index: 100;
        gap: 10px;
      }

      body.dark-background .bottom-bar {
        background: var(--card-dark);
        border-color: var(--border-dark);
      }

      .filter-toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        cursor: pointer;
        user-select: none;
      }

      .filter-toggle input { display: none; }

      .filter-toggle .switch {
        width: 40px;
        height: 22px;
        border-radius: 11px;
        background: #cbd5e1;
        position: relative;
        transition: background 0.25s ease;
        flex-shrink: 0;
      }

      .filter-toggle .switch::after {
        content: '';
        position: absolute;
        top: 3px;
        right: 3px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        transition: transform 0.25s ease;
      }

      .filter-toggle input:checked + .switch { background: var(--success); }
      .filter-toggle input:checked + .switch::after { transform: translateX(-18px); }

      /* ============ Empty ============ */
      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: #94a3b8;
      }

      .empty-state .icon {
        font-size: 60px;
        opacity: 0.4;
        margin-bottom: 16px;
      }

      .empty-state h5 { font-weight: 700; color: #64748b; }
      body.dark-background .empty-state h5 { color: #94a3b8; }

      /* ============ Toast ============ */
      #toast-container {
        z-index: 99999 !important;
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .custom-toast {
        background: #fff;
        border-radius: 14px;
        padding: 12px 18px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 10px;
        animation: toastIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        border-right: 4px solid var(--primary);
        min-width: 260px;
        max-width: 90vw;
      }

      .custom-toast.success { border-right-color: var(--success); }
      .custom-toast.warning { border-right-color: var(--warning); }
      .custom-toast.danger { border-right-color: var(--danger); }
      .custom-toast.info { border-right-color: var(--info); }

      body.dark-background .custom-toast { background: #1e293b; color: #e2e8f0; }

      @keyframes toastIn {
        from { opacity: 0; transform: translateY(-20px) scale(0.9); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      /* ============ Dark mode for picker ============ */
      body.dark-background .datepicker-plot-area {
        background-color: #1e293b !important;
        color: #e2e8f0 !important;
        border-color: rgba(255,255,255,0.1) !important;
      }
      body.dark-background .datepicker-day-view .table-days td span {
        color: #e2e8f0 !important;
      }
      body.dark-background .datepicker-plot-area .datepicker-header {
        background: #334155 !important;
      }

      /* ============ Responsive ============ */
      @media (max-width: 480px) {
        .stat-value { font-size: 18px; }
        .brand-logo { width: 38px; height: 38px; min-width: 38px; font-size: 18px; }
        .add-btn { width: 38px; height: 38px; min-width: 38px; font-size: 20px; }
        .icon-btn { width: 38px; height: 38px; min-width: 38px; font-size: 16px; }
        .filter-toggle span:last-child { display: none; }
      }
    </style>



  </head>
  <body>

    <!-- ============ Loader ============ -->
    <div id="lode">
      <div class="spinner"></div>
      <p>لطفاً صبر کنید...</p>
    </div>

    <!-- ============ محتوای اصلی ============ -->
    <div class="container-lg py-3 px-2" id="Rudex">

      <!-- ===== Header ===== -->
      <div class="app-header">
        <div class="brand-logo">
          <i class="bi bi-check2-square"></i>
        </div>

        <div class="search-wrap">
          <i class="bi bi-search"></i>
          <input type="search" class="search-input" placeholder="جستجو در تسک‌ها..." id="search">
        </div>

        <button class="icon-btn" id="enableNotif" title="فعال‌سازی نوتیفیکیشن" type="button">
          <i class="bi bi-bell"></i>
        </button>

        <button class="icon-btn" id="switchCheckDarken" title="تغییر تم" type="button">
          <i class="bi bi-moon-stars"></i>
        </button>

        <button class="add-btn" id="create" title="تسک جدید" type="button">
          <i class="bi bi-plus-lg"></i>
        </button>
      </div>

      <!-- ===== Stats ===== -->
      <div class="stats-grid">
        <div class="stat-card stat-total">
          <div class="stat-icon"><i class="bi bi-list-task"></i></div>
          <div class="stat-value" id="stat-total">0</div>
          <div class="stat-label">کل تسک‌ها</div>
        </div>
        <div class="stat-card stat-done">
          <div class="stat-icon"><i class="bi bi-check2-circle"></i></div>
          <div class="stat-value" id="stat-done">0</div>
          <div class="stat-label">انجام شده</div>
        </div>
        <div class="stat-card stat-urgent">
          <div class="stat-icon"><i class="bi bi-exclamation-triangle"></i></div>
          <div class="stat-value" id="stat-urgent">0</div>
          <div class="stat-label">فوری</div>
        </div>
      </div>

      <!-- ===== Task list ===== -->
      <div id="from"></div>
    </div>

    <!-- ============ Bottom bar ============ -->
    <div class="bottom-bar">
      <label class="filter-toggle">
        <input type="checkbox" id="switchCheckDefault">
        <span class="switch"></span>
        <span>فقط انجام شده‌ها</span>
      </label>
      <div class="d-flex align-items-center gap-2">
        <i class="bi bi-clipboard-check text-muted"></i>
        <span id="count" class="fw-bold">0</span>
        <span class="text-muted">تسک</span>
      </div>
    </div>

    <!-- ============ Blur layer ============ -->
    <div class="blur-layer dis-hide" id="addblur"></div>

    <!-- ============ Form modal ============ -->
    <div class="form-modal dis-hide" id="display">
      <h5>
        <i class="bi bi-plus-circle" id="form-icon"></i>
        <span id="form-title">ایجاد تسک جدید</span>
      </h5>

      <div class="mb-3">
        <label class="form-label" for="titletask">عنوان تسک</label>
        <input type="text" class="form-control" id="titletask" placeholder="مثلاً: خرید نان">
      </div>

      <div class="mb-3">
        <label class="form-label" for="taskDiscript">توضیحات (اختیاری)</label>
        <textarea class="form-control" id="taskDiscript" rows="3" placeholder="جزئیات بیشتر..."></textarea>
      </div>

      <div class="mb-4">
        <label class="form-label" for="taskDeadline">
          ددلاین (اختیاری) - تاریخ شمسی
        </label>
        <input type="text" class="form-control" id="taskDeadline" placeholder="انتخاب تاریخ و ساعت..." readonly>
      </div>

      <div class="d-flex gap-2">
        <button class="btn-primary-gradient flex-grow-1" id="create2" type="button">
          <i class="bi bi-check-lg me-1"></i>
          <span id="submit-text">ایجاد تسک</span>
        </button>
        <button class="btn-ghost" id="cancelForm" type="button">
          انصراف
        </button>
      </div>
    </div>

    <!-- ============ Confirm delete ============ -->
    <div class="confirm-modal dis-hide" id="ask">
      <div class="icon-warn">
        <i class="bi bi-trash3"></i>
      </div>
      <h5 class="fw-bold mb-2">حذف تسک</h5>
      <p class="text-muted mb-4" style="font-size: 14px;">آیا از حذف این تسک مطمئن هستید؟ این عمل قابل بازگشت نیست.</p>
      <div class="d-flex gap-2">
        <button class="btn-danger flex-grow-1" id="yasdelete" type="button">
          <i class="bi bi-trash3 me-1"></i> بله، حذف کن
        </button>
        <button class="btn-ghost flex-grow-1" id="nodeleted" type="button">
          انصراف
        </button>
      </div>
    </div>

    <!-- ============ Toast ============ -->
    <div id="toast-container"></div>

    <!-- ============ Scripts ============ -->
   <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/persian-date@1.1.0/dist/persian-date.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/js/persian-datepicker.min.js"></script>
<script src="assets/bostrap/dist/js/bootstrap.bundle.min.js"></script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker
        .register("./service-worker.js")
        .then((reg) => console.log("✅ SW registered:", reg.scope))
        .catch((err) => console.warn("⚠️ SW registration failed:", err));
    });
  }
</script>

<script src="assets/js/app.js"></script>
  </body>
</html>
